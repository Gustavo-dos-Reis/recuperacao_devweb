<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Registro</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" placeholder="Seu nome completo">
                <span class="error-message" id="nameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
                <span class="error-message" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
                <span class="error-message" id="passwordError"></span>
                <div class="password-strength">
                    <span id="strengthIndicator"></span>
                    <span id="strengthText"></span>
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Registrar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
